<svg xmlns="http://www.w3.org/2000/svg" width="680" height="635" viewBox="0 0 680 635">
<title>Anthropic corporate structure</title>
<desc>Org chart: investors and the Long-Term Benefit Trust hold stock that elects the board, which controls Anthropic PBC, its international subsidiaries, and a strategic partnership with the Menlo-financed Anthology Fund.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#000"/></marker>
<style>
.b{fill:#fff;stroke:#000;stroke-width:1}
.ln{stroke:#000;stroke-width:1;fill:none}
.lnd{stroke:#000;stroke-width:1;fill:none;stroke-dasharray:5 3}
.t{font-family:'Trebuchet MS',Verdana,sans-serif;font-size:13px;font-weight:bold;fill:#000}
.p{font-family:'Trebuchet MS',Verdana,sans-serif;font-size:12px;fill:#000}
.s{font-family:'Trebuchet MS',Verdana,sans-serif;font-size:11px;fill:#000}
</style>
</defs>

<rect class="b" x="40" y="30" width="240" height="44"/>
<text class="t" x="160" y="52" text-anchor="middle" dominant-baseline="central">Investors</text>

<rect class="b" x="400" y="30" width="240" height="44"/>
<text class="t" x="520" y="52" text-anchor="middle" dominant-baseline="central">Long-term benefit trust</text>

<line class="ln" x1="160" y1="74" x2="160" y2="118" marker-end="url(#arrow)"/>
<text class="s" x="168" y="100">hold</text>

<line class="ln" x1="520" y1="74" x2="520" y2="118" marker-end="url(#arrow)"/>
<text class="s" x="528" y="100">holds</text>

<rect class="b" x="40" y="120" width="240" height="56"/>
<text class="t" x="160" y="138" text-anchor="middle" dominant-baseline="central">Voting common &amp; preferred</text>
<text class="s" x="160" y="158" text-anchor="middle" dominant-baseline="central">Multiple series, A through G</text>

<rect class="b" x="400" y="120" width="240" height="56"/>
<text class="t" x="520" y="138" text-anchor="middle" dominant-baseline="central">Class T common stock</text>
<text class="s" x="520" y="158" text-anchor="middle" dominant-baseline="central">Held only by the trust</text>

<text class="s" x="340" y="128" text-anchor="middle">supermajority</text>
<text class="s" x="340" y="141" text-anchor="middle">+ 3/4 of board</text>
<text class="s" x="340" y="154" text-anchor="middle">can override</text>
<line class="lnd" x1="280" y1="167" x2="400" y2="167" marker-end="url(#arrow)"/>

<path class="ln" d="M160 176 L160 195 L290 195 L290 218" marker-end="url(#arrow)"/>
<text class="s" x="152" y="208" text-anchor="end">elects 3 of 7</text>

<path class="ln" d="M520 176 L520 195 L390 195 L390 218" marker-end="url(#arrow)"/>
<text class="s" x="528" y="208">elects 4 of 7</text>

<rect class="b" x="200" y="220" width="280" height="56"/>
<text class="t" x="340" y="238" text-anchor="middle" dominant-baseline="central">Board of directors</text>
<text class="s" x="340" y="258" text-anchor="middle" dominant-baseline="central">Trust appoints the majority</text>

<line class="ln" x1="340" y1="276" x2="340" y2="318" marker-end="url(#arrow)"/>
<text class="s" x="348" y="300">controls</text>

<rect class="b" x="200" y="320" width="280" height="56"/>
<text class="t" x="340" y="338" text-anchor="middle" dominant-baseline="central">Anthropic, PBC</text>
<text class="s" x="340" y="358" text-anchor="middle" dominant-baseline="central">Delaware public benefit corp.</text>

<path class="ln" d="M260 376 L260 395 L220 395 L220 418" marker-end="url(#arrow)"/>
<text class="s" x="212" y="388" text-anchor="end">owns &amp; controls</text>

<path class="ln" d="M420 376 L420 395 L560 395 L560 418" marker-end="url(#arrow)"/>
<text class="s" x="490" y="388" text-anchor="middle">strategic partner</text>

<rect class="b" x="40" y="420" width="380" height="160"/>
<text class="t" x="230" y="442" text-anchor="middle">International operating subsidiaries</text>
<text class="s" x="230" y="460" text-anchor="middle">Wholly owned by Anthropic, PBC</text>

<rect class="b" x="60" y="478" width="110" height="40"/>
<text class="p" x="115" y="498" text-anchor="middle" dominant-baseline="central">UK</text>

<rect class="b" x="180" y="478" width="110" height="40"/>
<text class="p" x="235" y="498" text-anchor="middle" dominant-baseline="central">Ireland</text>

<rect class="b" x="300" y="478" width="110" height="40"/>
<text class="p" x="355" y="498" text-anchor="middle" dominant-baseline="central">Switzerland</text>

<rect class="b" x="60" y="528" width="110" height="40"/>
<text class="p" x="115" y="548" text-anchor="middle" dominant-baseline="central">France</text>

<rect class="b" x="180" y="528" width="110" height="40"/>
<text class="p" x="235" y="548" text-anchor="middle" dominant-baseline="central">Germany</text>

<rect class="b" x="300" y="528" width="110" height="40"/>
<text class="p" x="355" y="548" text-anchor="middle" dominant-baseline="central">Japan</text>

<rect class="b" x="470" y="420" width="180" height="56"/>
<text class="t" x="560" y="438" text-anchor="middle" dominant-baseline="central">Anthology Fund</text>
<text class="s" x="560" y="458" text-anchor="middle" dominant-baseline="central">$100M AI startup fund</text>

<line class="ln" x1="560" y1="528" x2="560" y2="484" marker-end="url(#arrow)"/>
<text class="s" x="568" y="510">solely finances</text>

<rect class="b" x="470" y="530" width="180" height="44"/>
<text class="t" x="560" y="552" text-anchor="middle" dominant-baseline="central">Menlo Ventures</text>

<text class="s" x="560" y="600" text-anchor="middle">Anthropic takes no equity in</text>
<text class="s" x="560" y="614" text-anchor="middle">fund or its portfolio</text>

</svg>
